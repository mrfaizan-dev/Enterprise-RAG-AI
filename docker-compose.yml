services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    restart: always

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8800:8800"
    environment:
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - .:/app
    depends_on:
      - redis
    restart: always

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A llama_project.celery_app worker --loglevel=info
    environment:
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - .:/app
    depends_on:
      - redis
      - backend
    restart: always

  frontend:
    build:
      context: ./scraper-frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./scraper-frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - PORT=3000
    restart: always
